apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: platform
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  description: Managed platform services and demonstration workloads.
  sourceRepos:
    - https://github.com/tukue/azure-platform-gitops.git
    - https://kubernetes.github.io/ingress-nginx
  destinations:
    - namespace: argocd
      server: https://kubernetes.default.svc
    - namespace: demo
      server: https://kubernetes.default.svc
    - namespace: ingress-nginx
      server: https://kubernetes.default.svc
    - namespace: kube-system
      server: https://kubernetes.default.svc
  clusterResourceWhitelist:
    - group: ""
      kind: Namespace
