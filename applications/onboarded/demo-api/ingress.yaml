apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: "demo-api"
  namespace: "demo"
  labels:
    app.kubernetes.io/name: "demo-api"
    platform.example.com/owner: "platform-team"
spec:
  ingressClassName: nginx
  rules:
    - host: "demo-api.internal.example.com"
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: "demo-api"
                port:
                  number: 80
