apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo-api
  namespace: demo
  labels:
    app.kubernetes.io/name: demo-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: demo-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: demo-api
        azure.workload.identity/use: "true"
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: /metrics
        prometheus.io/port: "8080"
    spec:
      serviceAccountName: crypto-demo-api
      automountServiceAccountToken: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: replace-with-your-acr.azurecr.io/demo-api:0.1.0
          imagePullPolicy: IfNotPresent
          envFrom:
            - secretRef:
                name: demo-api-runtime
                optional: true
          env:
            - name: AZURE_MANAGED_HSM_URI
              value: REPLACE_WITH_TERRAFORM_MANAGED_HSM_URI
            - name: AZURE_MANAGED_HSM_KEY_NAME
              value: REPLACE_WITH_MANAGED_HSM_SIGNING_KEY_NAME
            - name: AZURE_KEY_VAULT_URI
              value: REPLACE_WITH_TERRAFORM_KEY_VAULT_URI
            - name: CRYPTO_DEMO_SECRET_NAME
              value: ""
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 10001
