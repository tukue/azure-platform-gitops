name: Application validation

on:
  pull_request:
    paths:
      - "applications/demo-api/**"
      - ".github/workflows/application.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: applications/demo-api/src
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: applications/demo-api/src/requirements.txt
      - run: pip install -r requirements.txt
      - name: Run unit tests
        run: |
          mkdir -p ../test-results
          pytest -q --junitxml=../test-results/junit.xml
      - name: Publish test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: demo-api-test-results
          path: applications/demo-api/test-results/junit.xml
          if-no-files-found: error
      - name: Build container image
        run: docker build .. --tag demo-api:ci
