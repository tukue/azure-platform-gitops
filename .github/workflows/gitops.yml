name: GitOps validation

on:
  pull_request:
    paths:
      - "clusters/**"
      - "platform/**"
      - "applications/**"
      - "policies/**"
      - ".github/workflows/gitops.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  onboarding:
    name: Validate application registrations
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Test registration generator
        run: python -m unittest discover -s scripts -p "test_*.py"
      - name: Verify generated application workloads
        run: |
          shopt -s nullglob
          for config in applications/registrations/*.json; do
            application_name="$(basename "${config%.json}")"
            python scripts/onboard_application.py check \
              --config "$config" \
              --output "applications/onboarded/$application_name"
          done

  render:
    name: Render ${{ matrix.path }}
    needs: onboarding
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        path:
          - clusters/dev
          - platform
          - applications
    steps:
      - uses: actions/checkout@v5
      - uses: azure/setup-kubectl@v4
      - name: Install Conftest
        run: |
          curl --fail --location --silent --show-error \
            --output conftest.tar.gz \
            https://github.com/open-policy-agent/conftest/releases/download/v0.68.2/conftest_0.68.2_Linux_x86_64.tar.gz
          echo "e8144c6d6d2ae0260b869caa60c7c262a1f95ac63ec1e5d2fb19be452d606347  conftest.tar.gz" | sha256sum --check
          tar --extract --gzip --file conftest.tar.gz conftest
          sudo install --mode 0755 conftest /usr/local/bin/conftest
      - name: Verify policy tests
        run: conftest verify --policy policies/kubernetes
      - name: Check documentation links
        run: python scripts/check_markdown_links.py
      - name: Render Kustomize source
        run: |
          kubectl kustomize "${{ matrix.path }}" > rendered.yaml
          conftest test --policy policies/kubernetes --output github rendered.yaml
