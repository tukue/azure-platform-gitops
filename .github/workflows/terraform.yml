name: Terraform

on:
  pull_request:
    paths:
      - "infrastructure/**"
      - ".github/workflows/terraform.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infrastructure/environments/dev
    steps:
      - uses: actions/checkout@v5
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.10.4"
      - name: Check formatting
        run: terraform fmt -check -recursive ../..
      - name: Initialize without backend
        run: terraform init -backend=false
      - name: Validate configuration
        run: terraform validate

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: terraform-linters/setup-tflint@v6
        with:
          tflint_version: v0.64.0
      - name: Run TFLint
        run: |
          while IFS= read -r directory; do
            echo "Linting $directory"
            tflint --chdir="$directory"
          done < <(find infrastructure -name '*.tf' -printf '%h\n' | sort -u)

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Run advisory Checkov scan
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: infrastructure
          framework: terraform
          soft_fail: true

  plan:
    needs: [validate, lint]
    if: >-
      vars.AZURE_CLIENT_ID != '' && vars.AZURE_TENANT_ID != '' &&
      vars.AZURE_SUBSCRIPTION_ID != '' && vars.AZURE_PRINCIPAL_ID != '' &&
      vars.TF_ADMIN_GROUP_OBJECT_IDS != '' && vars.KEY_VAULT_NAME != ''
    runs-on: ubuntu-latest
    environment: dev
    defaults:
      run:
        working-directory: infrastructure/environments/dev
    env:
      ARM_USE_OIDC: true
      ARM_USE_AZUREAD: true
      ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      TF_VAR_subscription_id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      TF_VAR_project: platform
      TF_VAR_environment: dev
      TF_VAR_location: swedencentral
      TF_VAR_acr_name: ${{ vars.ACR_NAME }}
      TF_VAR_key_vault_name: ${{ vars.KEY_VAULT_NAME }}
      TF_VAR_admin_group_object_ids: ${{ vars.TF_ADMIN_GROUP_OBJECT_IDS }}
      TF_VAR_github_actions_principal_id: ${{ vars.AZURE_PRINCIPAL_ID }}
      TF_VAR_vnet_address_space: 10.20.0.0/16
      TF_VAR_aks_subnet_address_prefix: 10.20.0.0/22
      TF_VAR_private_endpoints_subnet_address_prefix: 10.20.4.0/24
      TF_VAR_private_cluster_enabled: false
      TF_VAR_api_server_authorized_ip_ranges: ${{ vars.AKS_API_SERVER_AUTHORIZED_IP_RANGES }}
    steps:
      - uses: actions/checkout@v5
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.10.4"
      - name: Initialize without backend
        run: terraform init -backend=false
      - name: Create speculative plan
        run: terraform plan -no-color -out=tfplan
